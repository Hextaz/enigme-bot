app = "enigme-bot"
primary_region = "cdg" # Paris (Charles de Gaulle)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_OPTIONS = "--max-old-space-size=120"

[mounts]
  source = "enigme_data"
  destination = "/app/data"

[processes]
  app = "node --max-old-space-size=120 src/index.js"

[deploy]
  release_command = "npm run deploy"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  process = "app"
